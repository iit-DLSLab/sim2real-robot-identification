[workspace]
name = "sim2real_robot_identification_env"
platforms = [
  "linux-64",
  # Isaac Lab 3 Omniverse wheels are manylinux_2_35 (Ubuntu 22.04+)
  { name = "linux-64-glibc-2-35", platform = "linux-64", glibc = "2.35" },
]
channels = ["conda-forge", "nvidia"]

[feature.common]
platforms = ["linux-64"]

[feature.common.dependencies]
pip = "*"
python = "*"
numpy = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
colcon-common-extensions = "*"
catkin_tools = "*"
rosdep = "*"
tqdm = "*"
gymnasium = "*"

[feature.common.pypi-dependencies]
readchar = "*"
torch = "*"
mujoco = { version = "==3.13.0", extras = ["sysid"] }
scipy = "*"

[feature.common.activation.env]
ROS_LOCALHOST_ONLY = "1"

[feature.humble]
channels = ["https://repo.prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
ros-humble-rosidl-generator-dds-idl = "*"
ros-humble-plotjuggler-ros = "*"

[feature.lyrical]
channels = ["https://repo.prefix.dev/robostack-lyrical"]

[feature.lyrical.dependencies]
ros-lyrical-desktop = "*"
ros-lyrical-rmw-cyclonedds-cpp = "*"
ros-lyrical-rosidl-generator-dds-idl = "*"
ros-lyrical-plotjuggler-ros = "*"

# ---------------------------------------------------------------------------
# System identification in Isaac Lab: Isaac Lab release from PyPI
# (lightweight, no Isaac Sim / Kit) + PACE from the git submodule.
# Separate from the ROS envs: Isaac Lab 3 pins mujoco~=3.12, the MuJoCo sysid needs 3.13.
# ---------------------------------------------------------------------------
[feature.isaaclab]
platforms = ["linux-64-glibc-2-35"]

[feature.isaaclab.dependencies]
python = "3.12.*"
pip = "*"
setuptools = "<82"  # torch 2.11 requires setuptools<82

[feature.isaaclab.pypi-dependencies]
isaaclab = { version = "==3.0.0", extras = ["all"] }
pace_sim2real = { path = "sysid_isaaclab/pace-sim2real/source/pace_sim2real", editable = true }
toml = "*"

[feature.isaaclab.pypi-options]
extra-index-urls = ["https://pypi.nvidia.com", "https://download.pytorch.org/whl/cu130"]
index-strategy = "unsafe-best-match"
# Mirrors Isaac Lab's [tool.uv].override-dependencies (not inherited from the wheel)
dependency-overrides = { packaging = ">=20,<27" }

[environments]
humble = ["common", "humble"]
lyrical = ["common", "lyrical"]
isaaclab = ["isaaclab"]
